name: tests

on:
  push:
    branches: ["main", "master", "final"]
  pull_request:
    branches: ["main", "master", "final"]

env:
  # Phase 8's reproducibility guard: pin native (BLAS/OpenMP/numba) thread
  # pools to 1 -- same rationale/pattern as app/streamlit_app.py,
  # scripts/40_build_cache.py, scripts/smoke_e2e.py, scripts/stress_app.py,
  # and src/agriopt/optim/solvers.py's own module-top guard.
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMBA_NUM_THREADS: "1"

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Python 3.13 -- matches this repo's own .venv (see .venv/pyvenv.cfg);
      # Python 3.11 was originally requested but never installed on the dev
      # machine (see README.md's Setup section).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install full requirements + editable package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run test suite (excluding tests that need gitignored data/models)
        run: pytest -m "not needs_data" -q

      - name: Headless end-to-end smoke test (committed cache only)
        run: python scripts\smoke_e2e.py

      - name: App tab smoke test (all tabs render, no exceptions)
        run: python scripts\check_app_tabs.py

  # The Streamlit Community Cloud deploy installs ONLY requirements-app.txt (pinned). The job above
  # tests against whatever `pip install -r requirements.txt` resolves today, so a pin that breaks the
  # app (pandas 3, numpy 2.5, streamlit 1.6x ...) would never be seen. This job installs exactly the
  # deployed stack (+ pytest) and runs the tests that only need the committed cache -- no xgboost /
  # scikit-learn / joblib, which the deployed app does not have either.
  app-pinned:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the deployed (pinned) stack
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-app.txt
          pip install pytest
          pip install -e . --no-deps

      - name: Tests that only need the committed cache
        run: >
          pytest -q -m "not needs_data"
          tests/test_app_smoke.py tests/test_cache_schema.py tests/test_deploy_readiness.py
          tests/test_risk_measure.py tests/test_risk_follows_scenario.py tests/test_panel_dm.py
          tests/test_results_not_stale.py tests/test_params_validation.py

      - name: Headless end-to-end smoke test (committed cache only)
        run: python scripts/smoke_e2e.py

      - name: App tab smoke test (all tabs render, no exceptions)
        run: python scripts/check_app_tabs.py
